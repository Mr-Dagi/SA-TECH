name: Deploy to Supabase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Deploy to Supabase Hosting
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SITE_NAME: ${{ secrets.SUPABASE_SITE_NAME }}
        run: |
          # Authenticate the CLI using the provided access token
          supabase login --access-token "$SUPABASE_ACCESS_TOKEN"

          # Deploy the built `dist` folder to the specified Supabase project/site
          # Note: set these secrets in your GitHub repository settings before pushing.
          supabase deploy --project-ref "$SUPABASE_PROJECT_REF" --site "$SUPABASE_SITE_NAME" ./dist
